name: AvantStay
description: >-
  AvantStay is a technology-enabled luxury vacation rental management and
  hospitality company operating professionally designed short-term rental homes
  built for group travel across premium destinations throughout the United
  States. Beyond curated beachfront villas, desert estates, and mountain cabins,
  AvantStay runs a full-service homeowner property-management program through its
  Lighthouse owner portal, a 24-hour guest concierge, and a real-estate brokerage
  for buyers acquiring investment vacation homes. It is a portfolio company of
  Bullpen Capital tracked in the API Evangelist network. As of this enrichment
  pass AvantStay publishes a consumer booking website and homeowner portal but no
  public developer API, SDK, or documentation surface.
